<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Territory Conquest</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="app-shell">
      <section class="game-surface" aria-label="Territory Conquest game board">
        <canvas id="gameCanvas" width="1280" height="760"></canvas>

        <div id="startOverlay" class="overlay">
          <div class="dialog">
            <p class="eyebrow">Territory Conquest</p>
            <h1>Pixel world domination</h1>
            <p class="lede">Choose a front, build pressure, and outplay bots or a peer-to-peer rival.</p>
            <div class="mode-grid">
              <button class="mode-card is-active" id="singleBtn" type="button">
                <span>Solo</span>
                <small>Bots</small>
              </button>
              <button class="mode-card" id="hostBtn" type="button">
                <span>Host</span>
                <small>Join code</small>
              </button>
              <button class="mode-card" id="joinBtn" type="button">
                <span>Join</span>
                <small>Paste code</small>
              </button>
            </div>
            <button id="startBtn" class="primary-action" type="button">Start Match</button>
          </div>
        </div>
      </section>

      <aside class="control-panel" aria-label="Game controls">
        <header class="panel-header">
          <div>
            <p class="eyebrow">Command Center</p>
            <h2 id="phaseTitle">Setup</h2>
          </div>
          <div id="connectionPill" class="pill">Offline</div>
        </header>

        <section class="stat-strip" aria-label="Match stats">
          <div><span>Land</span><strong id="territoryStat">0%</strong></div>
          <div><span>Army</span><strong id="armyStat">0</strong></div>
          <div><span>Units</span><strong id="groupsStat">0</strong></div>
          <div><span>Tick</span><strong id="tickStat">0</strong></div>
        </section>

        <section class="control-section compact-section">
          <div class="section-title">
            <h3>Orders</h3>
            <button id="retreatBtn" class="danger-action" type="button">Retreat</button>
          </div>
          <div class="segmented" id="splitButtons" aria-label="Army split amount">
            <button type="button" data-split="0.25">25%</button>
            <button type="button" data-split="0.5" class="is-active">50%</button>
            <button type="button" data-split="0.75">75%</button>
            <button type="button" data-split="1">All</button>
          </div>
        </section>

        <section class="control-section">
          <div class="section-title"><h3>Upgrades</h3></div>
          <div class="upgrade-list" id="upgradeList"></div>
        </section>

        <details class="control-section network-panel">
          <summary>Join Code Multiplayer</summary>
          <div class="network-actions">
            <button id="copyOfferBtn" type="button">Host Code</button>
            <button id="createAnswerBtn" type="button">Answer Code</button>
            <button id="acceptAnswerBtn" type="button">Accept</button>
          </div>
          <label>
            Incoming
            <textarea id="incomingCode" rows="4" spellcheck="false"></textarea>
          </label>
          <label>
            Outgoing
            <textarea id="outgoingCode" rows="4" readonly spellcheck="false"></textarea>
          </label>
          <p id="networkStatus" class="hint">Exchange codes, then play.</p>
        </details>
      </aside>
    </main>

    <script src="src/game.js"></script>
    <script src="src/ai.js"></script>
    <script src="src/render.js"></script>
    <script src="src/network.js"></script>
    <script src="src/input.js"></script>
  </body>
</html>
